<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bruce's Workout</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1c1b1b;
    --bg2: #252424;
    --bg3: #2e2d2d;
    --gold: #f5a623;
    --gold-dim: #c4831a;
    --text: #e8e4dc;
    --text-dim: #9a9590;
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    width: 100%;
    background: var(--bg2);
    border-bottom: 1px solid #3a3838;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    color: var(--gold);
    letter-spacing: 0.02em;
  }

  #progress-text {
    font-size: 1.1rem;
    color: var(--text-dim);
    font-weight: 300;
  }

  .container {
    width: 100%;
    max-width: 680px;
    padding: 24px 20px;
    flex: 1;
  }

  #screen-select {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 32px;
    gap: 16px;
  }

  #screen-select h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    color: var(--text);
    margin-bottom: 4px;
    text-align: center;
  }

  #screen-select p {
    color: var(--text-dim);
    font-size: 1.1rem;
    margin-bottom: 8px;
    text-align: center;
  }

  .tab-switcher {
    display: flex;
    width: 100%;
    max-width: 320px;
    background: var(--bg3);
    border-radius: var(--radius);
    padding: 4px;
    margin-bottom: 16px;
  }

  .tab-btn {
    flex: 1;
    padding: 10px;
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 500;
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .tab-btn.active { background: var(--gold); color: var(--bg); }

  .day-btn {
    width: 100%;
    max-width: 320px;
    padding: 20px 32px;
    border: 2px solid var(--gold);
    background: transparent;
    color: var(--gold);
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.03em;
  }

  .day-btn:hover, .day-btn:active { background: var(--gold); color: var(--bg); }

  .day-btn .sub {
    display: block;
    font-family: 'DM Sans', sans-serif;
    font-size: 1.1rem;
    font-weight: 300;
    margin-top: 4px;
    opacity: 0.75;
  }

  #tab-history-content { width: 100%; max-width: 480px; }

  .history-loading {
    text-align: center;
    color: var(--text-dim);
    padding: 40px 0;
    font-size: 0.9rem;
  }

  .history-empty {
    text-align: center;
    color: var(--text-dim);
    padding: 60px 0;
    font-size: 1rem;
  }

  .history-card {
    background: var(--bg2);
    border: 1px solid #3a3838;
    border-radius: var(--radius);
    margin-bottom: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.2s;
  }

  .history-card:hover { border-color: #555; }
  .history-card.open { border-color: var(--gold-dim); }

  .history-card-header {
    padding: 16px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .history-card-left { flex: 1; }

  .history-date {
    font-size: 1.1rem;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 3px;
  }

  .history-meta { font-size: 0.9rem; color: var(--text-dim); }

  .history-chevron {
    color: var(--text-dim);
    font-size: 1rem;
    transition: transform 0.2s;
    margin-left: 12px;
  }

  .history-card.open .history-chevron { transform: rotate(180deg); }

  .history-card-body {
    display: none;
    padding: 12px 18px 16px;
    border-top: 1px solid #3a3838;
  }

  .history-card.open .history-card-body { display: block; }

  .history-exercise-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid #2e2d2d;
    font-size: 0.95rem;
  }

  .history-exercise-row:last-child { border-bottom: none; }
  .history-ex-name { color: var(--text-dim); }
  .history-ex-val { color: var(--gold); font-weight: 500; }

  #timer-bar {
    display: none;
    width: 100%;
    background: var(--bg2);
    border-bottom: 1px solid #3a3838;
    padding: 8px 24px;
    text-align: center;
  }

  #timer-display {
    font-family: 'DM Sans', sans-serif;
    font-size: 1.4rem;
    color: var(--gold);
    font-weight: 500;
    letter-spacing: 0.08em;
  }

  #screen-workout { display: none; }

  .circuit-header { margin-bottom: 20px; }

  .circuit-header h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    color: var(--gold);
  }

  .circuit-header .rounds {
    font-size: 1.1rem;
    color: var(--text-dim);
    margin-top: 4px;
    font-weight: 300;
  }

  .exercise-card {
    background: var(--bg2);
    border: 1px solid #3a3838;
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 10px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    transition: border-color 0.2s;
  }

  .exercise-card:hover { border-color: #555; }
  .exercise-info { flex: 1; }

  .exercise-name {
    font-weight: 500;
    font-size: 1.4rem;
    color: var(--text);
    margin-bottom: 6px;
  }

  .exercise-meta {
    font-size: 1.2rem;
    color: var(--gold);
    font-weight: 400;
    margin-bottom: 4px;
  }

  .exercise-notes {
    font-size: 1.1rem;
    color: var(--text-dim);
    font-weight: 300;
    line-height: 1.4;
  }

  .info-btn {
    background: none;
    border: 1px solid #3a3838;
    color: var(--gold);
    border-radius: 50%;
    width: 38px;
    height: 38px;
    min-width: 38px;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    margin-top: 2px;
  }

  .info-btn:hover { background: var(--gold); color: var(--bg); border-color: var(--gold); }

  .stretch-header {
    margin: 28px 0 16px;
    padding-top: 20px;
    border-top: 1px solid #3a3838;
  }

  .stretch-header h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
    color: var(--text-dim);
  }

  .stretch-card {
    background: var(--bg);
    border: 1px solid #2e2d2d;
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-bottom: 8px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }

  #modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  #modal-overlay.open { display: flex; }

  #modal-box {
    background: var(--bg2);
    border: 1px solid var(--gold);
    border-radius: var(--radius);
    padding: 28px 24px;
    max-width: 500px;
    width: 100%;
    position: relative;
  }

  #modal-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    color: var(--gold);
    margin-bottom: 14px;
  }

  #modal-body {
    font-size: 1.2rem;
    color: var(--text);
    line-height: 1.65;
    font-weight: 300;
  }

  #modal-close {
    position: absolute;
    top: 14px;
    right: 16px;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 1.3rem;
    cursor: pointer;
    line-height: 1;
  }

  #modal-close:hover { color: var(--text); }

  .nav-row {
    display: flex;
    gap: 12px;
    margin-top: 28px;
    padding-bottom: 40px;
  }

  .btn-back {
    flex: 1;
    padding: 14px;
    background: none;
    border: 1px solid #3a3838;
    color: var(--text-dim);
    border-radius: var(--radius);
    font-family: 'DM Sans', sans-serif;
    font-size: 1.2rem;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-back:hover { border-color: #666; color: var(--text); }

  .btn-next {
    flex: 2;
    padding: 14px;
    background: var(--gold);
    border: none;
    color: var(--bg);
    border-radius: var(--radius);
    font-family: 'DM Sans', sans-serif;
    font-size: 1.3rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-next:hover { background: #fdb93a; }

  #screen-log { display: none; }

  .log-card {
    background: var(--bg2);
    border: 1px solid #3a3838;
    border-radius: var(--radius);
    padding: 28px 24px;
    margin-top: 16px;
  }

  .log-card h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    color: var(--gold);
    margin-bottom: 6px;
  }

  .log-card .subtitle {
    font-size: 0.95rem;
    color: var(--text-dim);
    margin-bottom: 24px;
  }

  .log-summary {
    background: var(--bg3);
    border-radius: 6px;
    padding: 14px 16px;
    margin-bottom: 20px;
    font-size: 0.9rem;
    color: var(--text-dim);
    line-height: 1.8;
  }

  .log-summary strong { color: var(--gold); font-weight: 500; }

  .btn-log {
    width: 100%;
    padding: 16px;
    background: var(--gold);
    border: none;
    color: var(--bg);
    border-radius: var(--radius);
    font-family: 'DM Sans', sans-serif;
    font-size: 1.1rem;
    font-weight: 500;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.2s;
  }

  .btn-log:hover { background: #fdb93a; }
  .btn-log:disabled { background: #555; cursor: not-allowed; }

  .btn-restart {
    width: 100%;
    padding: 14px;
    background: none;
    border: 1px solid #3a3838;
    color: var(--text-dim);
    border-radius: var(--radius);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    cursor: pointer;
    margin-top: 10px;
    transition: all 0.2s;
  }

  .btn-restart:hover { border-color: #666; color: var(--text); }

  #screen-success {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
    text-align: center;
    gap: 16px;
  }

  .success-icon { font-size: 3rem; margin-bottom: 8px; }

  #screen-success h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    color: var(--gold);
  }

  #screen-success p { color: var(--text-dim); font-size: 0.9rem; max-width: 280px; }

  #screen-loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 70vh;
    gap: 16px;
  }

  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid #3a3838;
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  #screen-loading p { color: var(--text-dim); font-size: 0.9rem; }

  #error-msg {
    display: none;
    background: #3a1a1a;
    border: 1px solid #7a3333;
    border-radius: var(--radius);
    padding: 16px;
    color: #e88;
    font-size: 0.85rem;
    margin-top: 16px;
  }

  #progress-bar-wrap { width: 100%; height: 3px; background: #3a3838; }
  #progress-bar { height: 100%; background: var(--gold); transition: width 0.3s ease; }

  @media (max-width: 400px) {
    header h1 { font-size: 1.5rem; }
    .exercise-name { font-size: 1.3rem; }
    .day-btn { font-size: 1.4rem; }
  }
</style>
</head>
<body>

<header>
  <h1>Bruce's Workout</h1>
  <span id="progress-text"></span>
</header>
<div id="progress-bar-wrap"><div id="progress-bar" style="width:0%"></div></div>
<div id="timer-bar"><span id="timer-display">0:00</span></div>

<div class="container">

  <div id="screen-loading">
    <div class="spinner"></div>
    <p>Loading workout data…</p>
    <div id="error-msg"></div>
  </div>

  <div id="screen-select" style="display:none">
    <h2>Good morning, Bruce.</h2>
    <p id="select-subtitle">What's on the schedule today?</p>
    <div class="tab-switcher">
      <button class="tab-btn active" id="tab-workout-btn" onclick="switchTab('workout')">Workout</button>
      <button class="tab-btn" id="tab-history-btn" onclick="switchTab('history')">History</button>
    </div>
    <div id="tab-workout-content">
      <button class="day-btn" onclick="startDay('Long')">
        Long Day
        <span class="sub">5 circuits · ~30 min</span>
      </button>
      <button class="day-btn" onclick="startDay('Short')">
        Short Day
        <span class="sub">3 circuits · ~15 min</span>
      </button>
    </div>
    <div id="tab-history-content" style="display:none; width:100%; max-width:480px">
      <div id="history-list"><div class="history-loading">Loading history…</div></div>
    </div>
  </div>

  <div id="screen-workout"></div>

  <div id="screen-log">
    <div class="log-card">
      <h2>Log This Workout</h2>
      <p class="subtitle" id="log-subtitle"></p>
      <div class="log-summary" id="log-summary"></div>
      <button class="btn-log" id="btn-save" onclick="submitLog()">Save Workout</button>
      <button class="btn-restart" onclick="showSelect()">← Start Over</button>
    </div>
  </div>

  <div id="screen-success">
    <div class="success-icon">✓</div>
    <h2>Logged.</h2>
    <p>Workout recorded successfully.</p>
    <button class="btn-restart" style="margin-top:24px;max-width:280px" onclick="showSelect()">Start Another</button>
  </div>

</div>

<div id="modal-overlay" onclick="closeModal(event)">
  <div id="modal-box">
    <button id="modal-close" onclick="closeModal()">×</button>
    <div id="modal-title"></div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const SHEET_ID    = '13_fncUAXHUj_vNJh4ZQ3EamA0G4OitcVjMRCIQc3Wlw';
const LOG_SHEET_ID = '1ZZKYdoCq6GZMKr49nCxtB6JnC3HoDu_qf7JeaaNmw4U';
const API_KEY     = 'AIzaSyAL-1ytYPq_BnQhEW8huck85Q05Xp5uIuc';
const LOG_WEBHOOK = 'https://script.google.com/macros/s/AKfycbwmMCVz2IdzxTMvsSiT3DJNFOhrMoD5oM7_RtTfQPJWFwCMPB-ETdXqj1b8nXpnF4EEb0XJ/exec';

let allData = { Long: [], Short: [], definitions: {} };
let currentDay = '';
let currentStep = 0;
let steps = [];
let historyLoaded = false;

let timerInterval = null;
let timerSeconds = 0;

function startTimer() {
  timerSeconds = 0;
  document.getElementById('timer-bar').style.display = 'block';
  updateTimerDisplay();
  timerInterval = setInterval(() => { timerSeconds++; updateTimerDisplay(); }, 1000);
}

function stopTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
}

function updateTimerDisplay() {
  const m = Math.floor(timerSeconds / 60);
  const s = timerSeconds % 60;
  document.getElementById('timer-display').textContent = m + ':' + String(s).padStart(2, '0');
}

function getElapsedMinutes() {
  return Math.round(timerSeconds / 60);
}

function extractWeight(notes) {
  if (!notes) return null;
  const match = notes.match(/(\d+\.?\d*)\s*lb/i);
  return match ? match[1] + ' lb' : null;
}

async function loadData() {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/Sheet1?key=${API_KEY}`;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    parseSheet(json.values);
    show('screen-select');
    hide('screen-loading');
  } catch(e) {
    document.getElementById('error-msg').style.display = 'block';
    document.getElementById('error-msg').textContent = 'Could not load workout data. (' + e.message + ')';
  }
}

function parseSheet(rows) {
  let curDay = null;
  let currentCircuit = null;
  let inDefinitions = false;

  for (const row of rows) {
    const [col0, col1, col2, col3, col4] = row.map(c => (c||'').trim());
    if (!col0 && !col1) continue;

    if (col0.startsWith('DAY 1')) { curDay = 'Long'; inDefinitions = false; continue; }
    if (col0.startsWith('DAY 2')) { curDay = 'Short'; inDefinitions = false; continue; }
    if (col0 === 'DEFINITIONS') { inDefinitions = true; continue; }

    if (inDefinitions) { if (col0) allData.definitions[col0] = col1; continue; }
    if (!curDay) continue;
    const day = col0;
    if (!day || (day !== 'Long' && day !== 'Short')) continue;

    if (col1.match(/^Circuit \d+/i)) {
      currentCircuit = { type: 'circuit', label: col1, rounds: col2 || '', exercises: [] };
      allData[day].push(currentCircuit);
      continue;
    }
    if (col1 === 'Stretches') {
      currentCircuit = { type: 'stretch', label: 'Stretches', rounds: '', exercises: [] };
      allData[day].push(currentCircuit);
      continue;
    }
    if (currentCircuit && col1 && col1 !== 'Exercise') {
      currentCircuit.exercises.push({ name: col1, sets: col2, reps: col3, notes: col4 || '' });
    }
  }
}

function switchTab(tab) {
  const workoutBtn = document.getElementById('tab-workout-btn');
  const historyBtn = document.getElementById('tab-history-btn');
  const workoutContent = document.getElementById('tab-workout-content');
  const historyContent = document.getElementById('tab-history-content');
  const subtitle = document.getElementById('select-subtitle');

  if (tab === 'workout') {
    workoutBtn.classList.add('active');
    historyBtn.classList.remove('active');
    workoutContent.style.display = 'flex';
    workoutContent.style.flexDirection = 'column';
    workoutContent.style.alignItems = 'center';
    workoutContent.style.gap = '16px';
    historyContent.style.display = 'none';
    subtitle.textContent = "What's on the schedule today?";
  } else {
    historyBtn.classList.add('active');
    workoutBtn.classList.remove('active');
    workoutContent.style.display = 'none';
    historyContent.style.display = 'block';
    subtitle.textContent = 'Your workout history.';
    if (!historyLoaded) loadHistory();
  }
}

async function loadHistory() {
  historyLoaded = true;
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${LOG_SHEET_ID}/values/Sheet1?key=${API_KEY}`;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    renderHistory(json.values || []);
  } catch(e) {
    document.getElementById('history-list').innerHTML =
      '<div class="history-empty">Could not load history.</div>';
  }
}

function renderHistory(rows) {
  if (!rows || rows.length < 2) {
    document.getElementById('history-list').innerHTML =
      '<div class="history-empty">No workouts logged yet.</div>';
    return;
  }

  const headers = rows[0];
  const dataRows = rows.slice(1).reverse();

  let html = '';
  dataRows.forEach((row, idx) => {
    const date = row[0] || '';
    const dayType = row[1] || '';
    const duration = row[2] || '';
    if (!date) return;

    const dateObj = new Date(date + 'T12:00:00');
    const dateStr = dateObj.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });

    let exHtml = '';
    for (let i = 3; i < headers.length; i++) {
      const name = headers[i] || '';
      const val = row[i] || '';
      if (!name) continue;
      exHtml += `<div class="history-exercise-row">
        <span class="history-ex-name">${name}</span>
        <span class="history-ex-val">${val || '—'}</span>
      </div>`;
    }

    html += `<div class="history-card" id="hcard-${idx}" onclick="toggleHistoryCard(${idx})">
      <div class="history-card-header">
        <div class="history-card-left">
          <div class="history-date">${dateStr}</div>
          <div class="history-meta">${dayType} Day · ${duration} min</div>
        </div>
        <span class="history-chevron">▾</span>
      </div>
      <div class="history-card-body">${exHtml}</div>
    </div>`;
  });

  document.getElementById('history-list').innerHTML = html || '<div class="history-empty">No workouts logged yet.</div>';
}

function toggleHistoryCard(idx) {
  const card = document.getElementById('hcard-' + idx);
  card.classList.toggle('open');
}

function buildExerciseSnapshot(day) {
  const snapshot = {};
  for (const step of allData[day]) {
    for (const ex of step.exercises) {
      let desc = '';
      if (step.type === 'stretch') {
        desc = ex.reps || ex.sets || '60 sec';
      } else {
        const parts = [];
        if (ex.sets && ex.reps) parts.push(ex.sets + 'x' + ex.reps);
        else if (ex.reps) parts.push(ex.reps);
        else if (ex.sets) parts.push(ex.sets);
        const weight = extractWeight(ex.notes || '');
        if (weight) parts.push('@ ' + weight);
        desc = parts.join(' ') || '—';
      }
      snapshot[ex.name] = desc;
    }
  }
  return snapshot;
}

function startDay(day) {
  currentDay = day;
  steps = allData[day];
  currentStep = 0;
  startTimer();
  renderStep();
  show('screen-workout');
  hide('screen-select');
}

function renderStep() {
  const total = steps.length;
  const pct = Math.round((currentStep / total) * 100);
  document.getElementById('progress-bar').style.width = pct + '%';

  const isLast = currentStep === total - 1;
  const step = steps[currentStep];

  const circuitSteps = steps.filter(s => s.type === 'circuit');
  const circuitIdx = steps.slice(0, currentStep + 1).filter(s => s.type === 'circuit').length;
  document.getElementById('progress-text').textContent =
    step.type === 'circuit' ? `Circuit ${circuitIdx} of ${circuitSteps.length}` : 'Stretches';

  let html = '';
  if (step.type === 'circuit') {
    html += `<div class="circuit-header">
      <h2>${step.label}</h2>
      ${step.rounds ? `<div class="rounds">${step.rounds}</div>` : ''}
    </div>`;
    for (const ex of step.exercises) {
      const hasDef = !!allData.definitions[ex.name];
      const weight = extractWeight(ex.notes || '');
      const metaParts = [];
      if (ex.sets && ex.reps) metaParts.push(ex.sets + ' sets · ' + ex.reps);
      else if (ex.reps) metaParts.push(ex.reps);
      else if (ex.sets) metaParts.push(ex.sets);
      if (weight) metaParts.push(weight);
      const meta = metaParts.join(' · ');
      html += `<div class="exercise-card">
        <div class="exercise-info">
          <div class="exercise-name">${ex.name}</div>
          ${meta ? `<div class="exercise-meta">${meta}</div>` : ''}
        </div>
        ${hasDef ? `<button class="info-btn" onclick="showDef('${ex.name.replace(/'/g,"\\'")}')">ℹ</button>` : ''}
      </div>`;
    }
  } else {
    html += `<div class="stretch-header"><h2>Stretches</h2></div>`;
    for (const ex of step.exercises) {
      const hasDef = !!allData.definitions[ex.name];
      const dur = ex.reps || ex.sets || '';
      html += `<div class="stretch-card">
        <div class="exercise-info">
          <div class="exercise-name">${ex.name}</div>
          ${dur ? `<div class="exercise-meta">${dur}</div>` : ''}
        </div>
        ${hasDef ? `<button class="info-btn" onclick="showDef('${ex.name.replace(/'/g,"\\'")}')">ℹ</button>` : ''}
      </div>`;
    }
  }

  html += `<div class="nav-row">
    ${currentStep > 0 ? `<button class="btn-back" onclick="goBack()">← Back</button>` : ''}
    <button class="btn-next" onclick="goNext()">${isLast ? 'Finish →' : 'Next →'}</button>
  </div>`;

  document.getElementById('screen-workout').innerHTML = html;
  window.scrollTo(0, 0);
}

function goNext() {
  if (currentStep < steps.length - 1) { currentStep++; renderStep(); }
  else { stopTimer(); showLog(); }
}

function goBack() {
  if (currentStep > 0) { currentStep--; renderStep(); }
}

function showLog() {
  hide('screen-workout');
  document.getElementById('progress-bar').style.width = '100%';
  document.getElementById('progress-text').textContent = 'Done!';

  const elapsed = getElapsedMinutes();
  const today = new Date().toLocaleDateString('en-CA');
  const snapshot = buildExerciseSnapshot(currentDay);

  window._logPayload = { date: today, dayType: currentDay, duration: elapsed, exercises: snapshot };

  const m = Math.floor(timerSeconds / 60);
  const s = timerSeconds % 60;
  const timeStr = m + ':' + String(s).padStart(2, '0');

  document.getElementById('log-subtitle').textContent = `${currentDay} Day · ${timeStr} · ${today}`;

  let summaryHtml = `<strong>Date:</strong> ${today}<br><strong>Day:</strong> ${currentDay}<br><strong>Duration:</strong> ${elapsed} min<br><br>`;
  for (const [name, val] of Object.entries(snapshot)) {
    summaryHtml += `<strong>${name}:</strong> ${val}<br>`;
  }
  document.getElementById('log-summary').innerHTML = summaryHtml;
  show('screen-log');
}

async function submitLog() {
  const btn = document.getElementById('btn-save');
  btn.disabled = true;
  btn.textContent = 'Saving…';

  try {
    await fetch(LOG_WEBHOOK, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(window._logPayload)
    });
    hide('screen-log');
    document.getElementById('timer-bar').style.display = 'none';
    historyLoaded = false;
    document.getElementById('screen-success').style.display = 'flex';
  } catch(e) {
    btn.disabled = false;
    btn.textContent = 'Save Workout';
    alert('Save failed. Check your connection and try again.');
  }
}

function showSelect() {
  stopTimer();
  timerSeconds = 0;
  hide('screen-workout');
  hide('screen-log');
  document.getElementById('screen-success').style.display = 'none';
  document.getElementById('timer-bar').style.display = 'none';
  document.getElementById('progress-bar').style.width = '0%';
  document.getElementById('progress-text').textContent = '';
  switchTab('workout');
  show('screen-select');
}

function showDef(name) {
  const def = allData.definitions[name];
  if (!def) return;
  document.getElementById('modal-title').textContent = name;
document.getElementById('modal-body').innerHTML = def.replace(/\n/g, '<br>');
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(e) {
  if (!e || e.target === document.getElementById('modal-overlay') || e.currentTarget.id === 'modal-close') {
    document.getElementById('modal-overlay').classList.remove('open');
  }
}

function show(id) { document.getElementById(id).style.display = 'block'; }
function hide(id) { document.getElementById(id).style.display = 'none'; }

loadData();
</script>
</body>
</html>
